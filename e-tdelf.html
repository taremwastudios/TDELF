<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-TDELF Debate Tabulation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="router.js"></script>
    <style>
        /* Tabulation Section Styles */
        .section { max-width: 800px; margin: 2rem auto; padding: 1rem; }
        .code-input-container { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; }
        #invitation-code { padding: 0.5rem; flex: 1; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        .error { color: red; margin-top: 0.5rem; font-size: 0.9rem; }
        .bracket-container { margin: 2rem 0; min-height: 300px; }
        .matches-container { display: flex; flex-direction: column; gap: 1.5rem; }
        .match-form { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .participant { flex: 1; text-align: center; }
        .vs { font-weight: bold; }
        .score-input { margin: 0.5rem 0; }
        .score-input label { display: block; margin-bottom: 0.25rem; }
        .score-input input { width: 60px; padding: 0.25rem; }
        .submit-btn { background: #4CAF50; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; }
        .submit-btn:hover { background: #45a049; }
        .bracket-simple { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; }
        .bracket-match { display: flex; justify-content: space-between; width: 300px; }
        .participant-slot { text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo"><img src="tdelf.png" alt="TDELF Logo"></div>
            <nav>
                <ul>
                    <li><a href="/home">Home</a></li>
                    <li><a href="/support">Support</a></li>
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/e-tdelf">e-TDELF</a></li>
                    <li><a href="/meet">Meet</a></li>
                    <li><a href="/learn">Learn</a></li>
                    <li><a href="/products">Products</a></li>
                    <li><a href="/settings">Settings</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Invitation Code Entry Section -->
        <section id="code-entry" class="section">
            <h2>Enter Invitation Code</h2>
            <div class="code-input-container">
                <input type="text" id="invitation-code" placeholder="e.g., ROUND1-ABCD" maxlength="20" />
                <button id="validate-code">Validate</button>
                <p id="code-error" class="error"></p>
            </div>
        </section>

        <!-- Bracket & Score Section (hidden until code validated) -->
        <section id="tabulation-section" class="section" style="display: none;">
            <h2>Round: <span id="round-name"></span></h2>
            
            <!-- Bracket Visualization -->
            <div id="bracket-container" class="bracket-container bracket-simple">
                <!-- Bracket will be rendered here by JavaScript -->
            </div>
            
            <!-- Score Forms (one per match) -->
            <div id="matches-container" class="matches-container">
                <!-- Match forms will be injected here -->
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://uqvrpmsrhjsypupfdxxy.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxdnJwbXNyaGpzeXB1cGZkeHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTA2MjcsImV4cCI6MjA5NDUyNjYyN30.W-3BRcLiL7M9e6zmE_wi3Af5xXroO5U5M0LXBVw3d_0';
        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // State
        let currentRoundId = null;
        let currentRoundNumber = null;
        let judgeId = null;
        let currentCode = null;

        // DOM Elements
        const codeEntrySection = document.getElementById('code-entry');
        const tabulationSection = document.getElementById('tabulation-section');
        const invitationCodeInput = document.getElementById('invitation-code');
        const validateCodeBtn = document.getElementById('validate-code');
        const codeError = document.getElementById('code-error');
        const roundNameEl = document.getElementById('round-name');
        const bracketContainer = document.getElementById('bracket-container');
        const matchesContainer = document.getElementById('matches-container');

        // Validate Invitation Code
        validateCodeBtn.addEventListener('click', async () => {
            const code = invitationCodeInput.value.trim();
            if (!code) {
                codeError.textContent = 'Please enter an invitation code.';
                return;
            }

            try {
                // Find the invitation code in the database
                const { data: codeData, error: codeError } = await supabase
                    .from('invitation_codes')
                    .select(`
                      id,
                      code,
                      round_id,
                      rounds!inner (
                        id,
                        name,
                        round_number,
                        tournaments!inner (
                          id,
                          name
                        )
                      )
                    `)
                    .eq('code', code)
                    .single();

                if (codeError) throw codeError;
                if (!codeData) {
                    codeError.textContent = 'Invalid invitation code.';
                    return;
                }

                // Optional: Check expiration and usage limits
                const now = new Date();
                if (codeData.expires_at && new Date(codeData.expires_at) < now) {
                    codeError.textContent = 'This invitation code has expired.';
                    return;
                }
                if (codeData.max_uses !== null && codeData.used_count >= codeData.max_uses) {
                    codeError.textContent = 'This invitation code has reached its usage limit.';
                    return;
                }

                // Code is valid! Set state and load round data
                currentCode = code;
                currentRoundId = codeData.round_id;
                const roundInfo = codeData.rounds;
                roundNameEl.textContent = `${roundInfo.name} (Round ${roundInfo.round_number}) - ${roundInfo.tournaments.name}`;

                // Hide code entry, show tabulation
                codeEntrySection.style.display = 'none';
                tabulationSection.style.display = 'block';

                // Load matches and render bracket
                await loadRoundData();

                // Set up real-time updates for scores
                setupRealtimeUpdates();
            } catch (err) {
                console.error(err);
                codeError.textContent = 'Error validating code. Please try again.';
            }
        });

        // Load matches for the current round and render bracket + score forms
        async function loadRoundData() {
            try {
                // Fetch matches for this round with participant details
                const { data: matches, error } = await supabase
                    .from('matches')
                    .select(`
                      id,
                      participant1_id,
                      participant2_id,
                      winner_id,
                      score1,
                      score2,
                      status,
                      participants!matches_participant1_id_fkey (
                        id,
                        name,
                        team
                      ),
                      participants!matches_participant2_id_fkey (
                        id,
                        name,
                        team
                      )
                    `)
                    .eq('round_id', currentRoundId)
                    .order('id'); // Order by match ID for consistent bracket

                if (error) throw error;

                // Clear containers
                bracketContainer.innerHTML = '';
                matchesContainer.innerHTML = '';

                // Render bracket (simplified - you'd use a library for complex brackets)
                renderSimpleBracket(matches);

                // Render score forms for each match
                matches.forEach(match => {
                    const matchForm = createMatchForm(match);
                    matchesContainer.appendChild(matchForm);
                });
            } catch (err) {
                console.error(err);
                alert('Error loading round data.');
            }
        }

        // Simple bracket renderer (for demonstration - replace with a proper library)
        function renderSimpleBracket(matches) {
            matches.forEach((match, index) => {
                const matchEl = document.createElement('div');
                matchEl.className = 'bracket-match';
                const p1Name = match.participants_matches_participant1_id_fkey?.name || 'TBD';
                const p1Team = match.participants_matches_participant1_id_fkey?.team || '';
                const p2Name = match.participants_matches_participant2_id_fkey?.name || 'TBD';
                const p2Team = match.participants_matches_participant2_id_fkey?.team || '';
                
                matchEl.innerHTML = `
                    <div class="participant-slot">
                        <p>${p1Name}</p>
                        <small>${p1Team}</small>
                    </div>
                    <div class="participant-slot">
                        <p>${p2Name}</p>
                        <small>${p2Team}</small>
                    </div>
                `;
                bracketContainer.appendChild(matchEl);
            });
        }

        // Create a score form for a match
        function createMatchForm(match) {
            const form = document.createElement('div');
            form.className = 'match-form';
            form.dataset.matchId = match.id;

            const p1 = match.participants_matches_participant1_id_fkey;
            const p2 = match.participants_matches_participant2_id_fkey;

            form.innerHTML = `
                <div class="match-header">
                    <div class="participant">
                        <h3>${p1?.name || 'Participant 1'}</h3>
                        <p>${p1?.team || ''}</p>
                    </div>
                    <div class="vs">VS</div>
                    <div class="participant">
                        <h3>${p2?.name || 'Participant 2'}</h3>
                        <p>${p2?.team || ''}</p>
                    </div>
                </div>
                <div class="score-input">
                    <label for="points1-${match.id}">${p1?.name || 'Participant 1'} Points:</label>
                    <input type="number" id="points1-${match.id}" min="0" value="${match.score1 || 0}">
                </div>
                <div class="score-input">
                    <label for="points2-${match.id}">${p2?.name || 'Participant 2'} Points:</label>
                    <input type="number" id="points2-${match.id}" min="0" value="${match.score2 || 0}">
                </div>
                <button class="submit-btn" data-match-id="${match.id}">Submit Scores</button>
            `;

            // Handle score submission
            const submitBtn = form.querySelector('.submit-btn');
            submitBtn.addEventListener('click', async () => {
                const points1 = parseInt(form.querySelector(`#points1-${match.id}`).value) || 0;
                const points2 = parseInt(form.querySelector(`#points2-${match.id}`).value) || 0;

                try {
                    // Update match scores
                    const { error: matchError } = await supabase
                        .from('matches')
                        .update({ 
                            score1: points1, 
                            score2: points2, 
                            status: points1 > 0 || points2 > 0 ? 'in_progress' : 'scheduled' 
                        })
                        .eq('id', match.id);

                    if (matchError) throw matchError;

                    // Determine winner (if scores are set and not equal)
                    let winnerId = null;
                    if (points1 > points2) winnerId = p1.id;
                    else if (points2 > points1) winnerId = p2.id;

                    if (winnerId) {
                        const { error: winnerError } = await supabase
                            .from('matches')
                            .update({ winner_id: winnerId, status: 'completed' })
                            .eq('id', match.id);
                        if (winnerError) throw winnerError;
                    }

                    // Optionally, log individual judge scores (if you want per-judge tracking)
                    // For simplicity, we're updating the match directly. For per-judge scores, you'd insert into the `scores` table.

                    alert('Scores submitted successfully!');
                    // Optionally, refresh the match display to reflect updates
                    // loadRoundData(); // or update just this match
                } catch (err) {
                    console.error(err);
                    alert('Error submitting scores. Please try again.');
                }
            });

            return form;
        }

        // Set up real-time subscription to score changes
        function setupRealtimeUpdates() {
            supabase
                .channel('match-changes')
                .on(
                    'postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'matches', filter: `round_id=eq.${currentRoundId}` },
                    (payload) => {
                        // Update the specific match in the UI without full reload
                        const matchId = payload.new.id;
                        const matchElement = document.querySelector(`.match-form[data-match-id="${matchId}"]`);
                        if (matchElement) {
                            // Update the score inputs
                            matchElement.querySelector(`#points1-${matchId}`).value = payload.new.score1 || 0;
                            matchElement.querySelector(`#points2-${matchId}`).value = payload.new.score2 || 0;
                            // You could also update the bracket display here if needed
                        }
                        // Re-render bracket to reflect any changes (winner, etc.)
                        loadRoundData(); // Simple approach: reload all data
                    }
                )
                .subscribe();
        }
    </script>
</body>
</html>
